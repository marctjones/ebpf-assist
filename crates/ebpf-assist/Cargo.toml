[package]
name = "ebpf-assist"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for managing eBPF programs via ebpf-assistd"
readme = "../../README.md"
keywords = ["ebpf", "bpf", "tracing", "linux", "ai"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ebpf-assist"
path = "src/main.rs"

[dependencies]
ebpf-assist-common = { path = "../ebpf-assist-common" }
ebpf-assist-vm = { path = "../ebpf-assist-vm" }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"

# Compilation helper
which = "6"
glob = "0.3"
dirs = "5"

[dev-dependencies]
tempfile = { workspace = true }
