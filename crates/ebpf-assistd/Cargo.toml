[package]
name = "ebpf-assistd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Daemon for ebpf-assist - loads eBPF programs with minimal privileges"
readme = "../../README.md"
keywords = ["ebpf", "bpf", "tracing", "linux", "daemon"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ebpf-assistd"
path = "src/main.rs"

[dependencies]
ebpf-assist-common = { path = "../ebpf-assist-common" }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# eBPF
aya = { workspace = true }

# Capabilities
capctl = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Unix socket
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

# D-Bus for polkit
zbus = "4"

# System calls
libc = "0.2"
